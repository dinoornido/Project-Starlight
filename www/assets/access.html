<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Staff Access · Kaditech</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#07090f; --card:#11141c; --line:#252a36; --gold:#c9a227; --ink:#e8ecf4; --dim:#8b93a4; --bad:#f87171; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100dvh; font-family: Inter, system-ui, sans-serif; background:var(--bg); color:var(--ink); }
    a { color:var(--gold); text-decoration:none; }
    .display { font-family: "Playfair Display", Georgia, serif; }
    .wrap { max-width:26rem; margin:0 auto; padding:4.5rem 1.25rem 3rem; }
    .eyebrow { font-size:.7rem; letter-spacing:.18em; text-transform:uppercase; color:var(--gold); font-weight:600; }
    h1 { font-size:2.1rem; line-height:1.15; margin:.5rem 0 0.8rem; }
    p.lead { color:var(--dim); line-height:1.6; margin:0 0 1.5rem; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:1.1rem; padding:1.35rem 1.3rem; }
    label { display:block; font-size:.72rem; color:var(--dim); margin:0.7rem 0 .3rem; letter-spacing:.04em; text-transform:uppercase; }
    input { width:100%; border:1px solid var(--line); background:#0b0e16; color:var(--ink); border-radius:.7rem; padding:.7rem .8rem; font:inherit; }
    input:focus { outline:2px solid rgba(201,162,39,.35); border-color:var(--gold); }
    button { margin-top:1.1rem; width:100%; min-height:2.8rem; border:0; border-radius:999px; background:var(--gold); color:#111; font-weight:700; font-size:.95rem; cursor:pointer; }
    button:hover { filter: brightness(1.05); }
    button:disabled { opacity:.7; cursor:wait; }
    .back { display:block; text-align:center; margin-top:1.2rem; color:var(--dim); font-size:.85rem; }
    .note { margin-top:1rem; font-size:.75rem; color:var(--dim); line-height:1.5; }
    .err { min-height:1.2em; margin-top:.75rem; font-size:.85rem; color:var(--bad); }
    .roles { margin:0 0 1rem; padding:0; list-style:none; color:var(--dim); font-size:.8rem; line-height:1.55; }
    .roles b { color:var(--ink); font-weight:600; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Kaditech · Staff door</p>
    <h1 class="display">Access</h1>
    <p class="lead">Shop login only. Clients stay on Help with Thomas.</p>
    <ul class="roles">
      <li><b>dino</b> — architect</li>
      <li><b>katharine</b> — admin</li>
      <li><b>ben</b> / <b>brendon</b> — tech</li>
    </ul>
    <form class="card" id="staff-form" autocomplete="on">
      <label for="u">Username</label>
      <input id="u" name="user" autocomplete="username" required />
      <label for="p">Password</label>
      <input id="p" name="pass" type="password" autocomplete="current-password" required />
      <p class="err" id="e" role="status"></p>
      <button type="submit" id="go">Enter StarGate</button>
      <p class="note">Same shop credentials as StarGate. After sign-in you land on the desk — Vault, Jobs, Remote, Expand.</p>
    </form>
    <a class="back" href="/help">Client? Open Help instead</a>
    <a class="back" href="/">← Kaditech home</a>
  </div>
  <script>
  (function () {
    var OP_KEY = "kaditech_operator_v1";
    var STAFF = {
      dino: { passHashes: ["7b71fb7eddc11fbe46d2b531ce14c1c0d4d0573ee553b0409cc2138ff6d82297","9a2e3d9c70d46e2855434e64deb5c9b6a9d64347ae9703c80751cb73686c5394","25606db04fc3f5b0dfbfdf70a8d2e8b6fbc501e0807a291951863e5ddbeb0a0d","a60a8e18ceae3fd459eb143bd987a764deb81e81756fb3968a11b2f2c0a7834b"], role: "admin", displayName: "Deacon Dino" },
      deacon: { passHashes: ["7b71fb7eddc11fbe46d2b531ce14c1c0d4d0573ee553b0409cc2138ff6d82297","9a2e3d9c70d46e2855434e64deb5c9b6a9d64347ae9703c80751cb73686c5394","25606db04fc3f5b0dfbfdf70a8d2e8b6fbc501e0807a291951863e5ddbeb0a0d","a60a8e18ceae3fd459eb143bd987a764deb81e81756fb3968a11b2f2c0a7834b"], role: "admin", displayName: "Deacon Dino" },
      katharine: { passHashes: ["cacdd7aed184c97df7bef2b8fd9d4e56d0b034db3e13f40c048a86ff9a49a34f"], role: "admin", displayName: "Katharine Ornido" },
      kathy: { passHashes: ["cacdd7aed184c97df7bef2b8fd9d4e56d0b034db3e13f40c048a86ff9a49a34f"], role: "admin", displayName: "Katharine Ornido" },
      k: { passHashes: ["cacdd7aed184c97df7bef2b8fd9d4e56d0b034db3e13f40c048a86ff9a49a34f"], role: "admin", displayName: "Katharine Ornido" },
      ben: { passHashes: ["faa8ef63502b843d95a00e4eae29e367d672dd11de97a382a27e8eccfc555dd0"], role: "tech", displayName: "Ben Quincey", personalAgent: "gus" },
      brendon: { passHashes: ["fe6e1a8784879abd9f9ac907d8dfc019312b5908a00cc0075f77d6822a15b223"], role: "tech", displayName: "Brandon Folan", personalAgent: "maul" },
      brandon: { passHashes: ["fe6e1a8784879abd9f9ac907d8dfc019312b5908a00cc0075f77d6822a15b223"], role: "tech", displayName: "Brandon Folan", personalAgent: "maul" },
      tech: { passHashes: ["fe6e1a8784879abd9f9ac907d8dfc019312b5908a00cc0075f77d6822a15b223"], role: "tech", displayName: "Brandon Folan", personalAgent: "maul" },
      "katharine@kaditech.com": { passHashes: ["cacdd7aed184c97df7bef2b8fd9d4e56d0b034db3e13f40c048a86ff9a49a34f"], role: "admin", displayName: "Katharine Ornido" },
      thomas: { passHashes: ["c5b0655ff257a1919e5b428a021d3d45030830cb2bbd6a07765bff2eb2a00c93"], role: "tech", displayName: "Thomas Aquinas (operator)" },
      ta: { passHashes: ["c5b0655ff257a1919e5b428a021d3d45030830cb2bbd6a07765bff2eb2a00c93"], role: "tech", displayName: "Thomas Aquinas (operator)" }
    };

    function sha256hexSync(str) {
      function rotr(n, x) { return (x >>> n) | (x << (32 - n)); }
      function utf8(s) {
        var out = [];
        for (var i = 0; i < s.length; i++) {
          var c = s.charCodeAt(i);
          if (c < 0x80) out.push(c);
          else if (c < 0x800) out.push(0xc0 | (c >> 6), 0x80 | (c & 63));
          else if (c < 0xd800 || c >= 0xe000) out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
          else {
            i++;
            c = 0x10000 + (((c & 0x3ff) << 10) | (s.charCodeAt(i) & 0x3ff));
            out.push(0xf0 | (c >> 18), 0x80 | ((c >> 12) & 63), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
          }
        }
        return out;
      }
      var K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
      var bytes = utf8(str);
      var bitLen = bytes.length * 8;
      bytes.push(0x80);
      while ((bytes.length % 64) !== 56) bytes.push(0);
      for (var i = 7; i >= 0; i--) bytes.push((Math.floor(bitLen / Math.pow(2, i * 8))) & 0xff);
      var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
      for (var off = 0; off < bytes.length; off += 64) {
        var w = [];
        for (var i = 0; i < 16; i++) {
          w[i] = (bytes[off + i*4] << 24) | (bytes[off + i*4+1] << 16) | (bytes[off + i*4+2] << 8) | bytes[off + i*4+3];
        }
        for (var i = 16; i < 64; i++) {
          var s0 = rotr(7, w[i-15]) ^ rotr(18, w[i-15]) ^ (w[i-15] >>> 3);
          var s1 = rotr(17, w[i-2]) ^ rotr(19, w[i-2]) ^ (w[i-2] >>> 10);
          w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
        }
        var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
        for (var i = 0; i < 64; i++) {
          var S1 = rotr(6,e) ^ rotr(11,e) ^ rotr(25,e);
          var ch = (e & f) ^ (~e & g);
          var t1 = (h + S1 + ch + K[i] + w[i]) | 0;
          var S0 = rotr(2,a) ^ rotr(13,a) ^ rotr(22,a);
          var maj = (a & b) ^ (a & c) ^ (b & c);
          var t2 = (S0 + maj) | 0;
          h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
        }
        H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0;
        H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
      }
      return H.map(function (x) { return (x >>> 0).toString(16).padStart(8, "0"); }).join("");
    }

    async function sha256hex(s) {
      try {
        if (globalThis.crypto && crypto.subtle) {
          var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
          return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
        }
      } catch (_) {}
      return sha256hexSync(s);
    }

    async function passOk(meta, plain) {
      if (!meta) return false;
      var raw = String(plain || "");
      var pw = raw.trim();
      if (!pw) return false;
      var hashes = [].concat(meta.passHashes || [], meta.passHash ? [meta.passHash] : []);
      if (!hashes.length) return false;
      for (var i = 0; i < 2; i++) {
        var candidate = i === 0 ? pw : raw;
        var h = await sha256hex(candidate);
        if (hashes.indexOf(h) !== -1) return true;
        if (hashes.indexOf(sha256hexSync(candidate)) !== -1) return true;
      }
      return false;
    }

    function writeGrant(user, meta) {
      var g = {
        v: 1,
        role: meta.role,
        user: user,
        displayName: meta.displayName,
        personalAgent: meta.personalAgent || null,
        exp: Date.now() + 12 * 3600 * 1000,
        at: Date.now()
      };
      var raw = btoa(unescape(encodeURIComponent(JSON.stringify(g))));
      try { localStorage.setItem(OP_KEY, raw); } catch (_) {}
      try { sessionStorage.setItem("sg_user", user); sessionStorage.setItem("sg_role", meta.role); } catch (_) {}
      try {
        document.cookie = OP_KEY + "=" + encodeURIComponent(raw) + "; path=/; max-age=43200; SameSite=Lax; Secure";
        document.cookie = OP_KEY + "=" + encodeURIComponent(raw) + "; path=/; domain=.kaditech.com; max-age=43200; SameSite=Lax; Secure";
      } catch (_) {}
      return g;
    }

    var form = document.getElementById("staff-form");
    var err = document.getElementById("e");
    var btn = document.getElementById("go");
    form.addEventListener("submit", async function (ev) {
      ev.preventDefault();
      var u = (document.getElementById("u").value || "").trim().toLowerCase();
      var p = document.getElementById("p").value || "";
      var meta = STAFF[u];
      err.textContent = "";
      if (!meta) {
        err.textContent = "Staff login only. Clients use Help.";
        return;
      }
      btn.disabled = true;
      btn.textContent = "Signing in…";
      var ok = false;
      try { ok = await passOk(meta, p); } catch (ex) { ok = false; }
      if (!ok) {
        err.textContent = "Username + password did not match staff records.";
        btn.disabled = false;
        btn.textContent = "Enter StarGate";
        return;
      }
      writeGrant(u, meta);
      location.href = "/assets/stargate.html";
    });
  })();
  </script>
</body>
</html>
